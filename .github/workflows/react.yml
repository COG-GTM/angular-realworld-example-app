name: React App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
