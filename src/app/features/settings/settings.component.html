<div class="settings-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Your Settings</h1>

        <app-list-errors [errors]="errors()" />

        <form [formGroup]="settingsForm" (ngSubmit)="submitForm()" [attr.aria-busy]="isSubmitting()">
          <fieldset [disabled]="isSubmitting()">
            <fieldset class="form-group">
              <label class="sr-only" for="settings-image">Profile picture URL</label>
              <input
                id="settings-image"
                class="form-control"
                type="text"
                inputmode="url"
                autocomplete="photo"
                placeholder="URL of profile picture"
                formControlName="image"
                name="image"
                [attr.aria-invalid]="hasError('image') || null"
              />
            </fieldset>

            <fieldset class="form-group">
              <label class="sr-only" for="settings-username">Username</label>
              <input
                id="settings-username"
                class="form-control form-control-lg"
                type="text"
                autocomplete="username"
                placeholder="Username"
                formControlName="username"
                name="username"
                [attr.aria-invalid]="hasError('username') || null"
              />
            </fieldset>

            <fieldset class="form-group">
              <label class="sr-only" for="settings-bio">Bio</label>
              <textarea
                id="settings-bio"
                class="form-control form-control-lg"
                rows="8"
                placeholder="Short bio about you"
                formControlName="bio"
                name="bio"
                [attr.aria-invalid]="hasError('bio') || null"
              ></textarea>
            </fieldset>

            <fieldset class="form-group">
              <label class="sr-only" for="settings-email">Email</label>
              <input
                id="settings-email"
                class="form-control form-control-lg"
                type="email"
                autocomplete="email"
                placeholder="Email"
                formControlName="email"
                name="email"
                [attr.aria-invalid]="hasError('email') || null"
              />
            </fieldset>

            <fieldset class="form-group">
              <label class="sr-only" for="settings-password">New password</label>
              <input
                id="settings-password"
                class="form-control form-control-lg"
                type="password"
                autocomplete="new-password"
                placeholder="New Password"
                formControlName="password"
                name="password"
                [attr.aria-invalid]="hasError('password') || null"
              />
            </fieldset>

            <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Update Settings</button>
          </fieldset>
        </form>

        <!-- Line break for logout button -->
        <hr />

        <button class="btn btn-outline-danger" type="button" (click)="logout()">Or click here to logout.</button>
      </div>
    </div>
  </div>
</div>
